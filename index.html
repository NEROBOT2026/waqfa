<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وقفة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#1C1815;--sf:#27221E;--ink:#F3ECE4;--mut:#A89F95;--ac:#E0704A;--gr:#6FB27E;--ln:#3A332D;--soft:#332C26;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,'Segoe UI',Tahoma,sans-serif;line-height:1.7;font-size:16px}

.big{font-size:84px;font-weight:800;line-height:1.1}

.pb{height:5px;background:var(--ln);border-radius:9px;margin:6px 24px;overflow:hidden}

.fr.gr{--c:var(--gr)}.fr.ac{--c:var(--ac)}

.ic.r{color:var(--ac)}

.it .ch{margin-inline-start:auto;color:var(--mut)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac);font-weight:800}

#ov.on{display:block}
.ovh{display:flex;align-items:center;gap:8px;max-width:480px;margin:0 auto 10px}
#ovb{max-width:480px;margin:0 auto}
#foot{position:fixed;bottom:0;left:0;right:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);display:none;z-index:11}
#foot.on{display:block}

.bbox{height:260px;border-radius:24px;background:linear-gradient(160deg,#7B6A58,#B3AFA8);display:grid;place-items:center;position:relative;overflow:hidden;margin:10px 0}
.bc{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.55);animation:b 8s ease-in-out infinite}
.btx{position:absolute;bottom:18px;color:#fff;font-size:22px;font-weight:800}

.lk{display:block;text-align:center;padding:12px;border:1px solid var(--ln);border-radius:14px;color:var(--ink);text-decoration:none;margin:8px 0}
.tas{width:190px;height:190px;border-radius:50%;font-size:56px;font-weight:800;display:block;margin:20px auto;background:var(--soft);color:var(--gr);border:3px solid var(--gr)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.cd{height:64px;font-size:26px}
.tk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.tk input{width:24px;height:24px;accent-color:var(--gr)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st .card{text-align:center;margin:0}.st b{font-size:30px;display:block}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:4px;opacity:.85}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px}
</style>
</head>

<div id="ov"><div class="ovh"><button id="back" aria-label="رجوع">→</button><b id="ovt"></b></div><div id="ovb"></div></div>
